<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern gradient -->
    <linearGradient id="modernGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C41E3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A01828;stop-opacity:1" />
    </linearGradient>
    
    <!-- Globe gradient -->
    <radialGradient id="globeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#C41E3A;stop-opacity:0.05" />
    </radialGradient>
  </defs>
  
  <!-- White background -->
  <rect width="200" height="200" fill="#FFFFFF"/>
  
  <!-- Globe circle background -->
  <circle cx="100" cy="80" r="55" fill="url(#globeGradient)"/>
  
  <!-- Stylized globe with meridians -->
  <circle cx="100" cy="80" r="45" fill="none" stroke="url(#modernGradient)" stroke-width="3"/>
  
  <!-- Vertical meridian -->
  <ellipse cx="100" cy="80" rx="15" ry="45" fill="none" stroke="url(#modernGradient)" stroke-width="2"/>
  
  <!-- Horizontal latitude lines -->
  <ellipse cx="100" cy="80" rx="45" ry="15" fill="none" stroke="url(#modernGradient)" stroke-width="2"/>
  <line x1="55" y1="80" x2="145" y2="80" stroke="url(#modernGradient)" stroke-width="2"/>
  
  <!-- Center dot -->
  <circle cx="100" cy="80" r="4" fill="url(#modernGradient)"/>
  
  <!-- Modern "WORLD TODAY" text -->
  <text x="100" y="155" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="24" font-weight="900" text-anchor="middle" fill="#1a1a2e" letter-spacing="1">
    WORLD
  </text>
  
  <text x="100" y="178" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="24" font-weight="900" text-anchor="middle" fill="url(#modernGradient)" letter-spacing="1">
    TODAY
  </text>
  
  <!-- Tagline -->
  <text x="100" y="192" font-family="'Arial', sans-serif" font-size="8" font-weight="600" text-anchor="middle" fill="#666666" letter-spacing="2">
    YOUR GLOBAL NEWS SOURCE
  </text>
</svg>
